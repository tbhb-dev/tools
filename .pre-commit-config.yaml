---
# Git hooks for this clone, installed by `prek install`. Hooks call the Bazel-pinned
# tools through the bazel_env shims in .bazel_env/bin (`bazelisk run
# //:bazel_env` builds them), never `bazel run`, so a running build's server lock can't stall a
# commit. `bazel test //...` runs every gate, whole-tree ones included.
default_stages: [pre-commit]
default_install_hook_types: [pre-commit, commit-msg, pre-push]

# Never touch Vale's synced style packages, build output, or test fixtures,
# which are deliberately malformed and must stay that way.
exclude: |
  (?x)^(
    \.vale/(Google|write-good|proselint|ai-tells.*)/|
    \.bazel-.*/|
    bazel-.*/|
    tmp/|
    \.worktrees/|
    (.*/)?(mutants|testdata)/
  )

repos:
  - repo: builtin
    hooks:
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: check-merge-conflict
      - id: check-symlinks
      - id: end-of-file-fixer
      - id: fix-byte-order-marker
      - id: mixed-line-ending
      - id: trailing-whitespace

  - repo: local
    hooks:
      # Lint and format the staged files with the same pins and configs as
      # the Bazel gates.
      - id: gitleaks
        name: gitleaks (staged changes)
        language: system
        entry: .bazel_env/bin/gitleaks git --pre-commit --staged --redact --no-banner --config .gitleaks.toml
        pass_filenames: false
      # The commit message: secrets, then the Conventional Commits header.
      - id: gitleaks-commit-msg
        name: gitleaks (commit message)
        language: system
        entry: bash -c '.bazel_env/bin/gitleaks stdin --redact --no-banner --config .gitleaks.toml < "$1"' --
        stages: [commit-msg]
        always_run: true
      - id: conventional-commits
        name: Conventional Commits
        language: system
        entry: .bazel_env/bin/cog verify --file
        stages: [commit-msg]
        always_run: true
      - id: ruff-format
        name: ruff format
        language: system
        entry: .bazel_env/bin/ruff format --force-exclude
        types_or: [python]
      - id: ruff-check
        name: ruff check
        language: system
        entry: .bazel_env/bin/ruff check --force-exclude
        types_or: [python]
      - id: shfmt
        name: shfmt
        language: system
        entry: .bazel_env/bin/shfmt -w
        types_or: [shell, bats]
      - id: shellcheck
        name: shellcheck
        language: system
        entry: .bazel_env/bin/shellcheck -o check-extra-masked-returns
        types_or: [shell, bats]
      - id: buildifier
        name: buildifier
        language: system
        entry: .bazel_env/bin/buildifier -mode=fix -lint=warn -warnings=all
        types: [bazel]
      - id: tombi-format
        name: tombi format
        language: system
        entry: .bazel_env/bin/tombi format --offline
        types: [toml]
      - id: ryl
        name: ryl
        language: system
        entry: .bazel_env/bin/ryl check --strict -c .ryl.toml
        types: [yaml]
      - id: rumdl
        name: rumdl
        language: system
        entry: .bazel_env/bin/rumdl check
        types: [markdown]
      - id: actionlint
        name: actionlint
        language: system
        # Its run: block checks need shellcheck, so it gets the pinned one.
        entry: env "SHELLCHECK_OPTS=-o check-extra-masked-returns" .bazel_env/bin/actionlint
        args: [-shellcheck, .bazel_env/bin/shellcheck]
        files: ^\.github/workflows/
      - id: editorconfig-checker
        name: editorconfig-checker
        language: system
        entry: .bazel_env/bin/editorconfig-checker -config .editorconfig-checker.json

      # Git can't ignore by size, so this rejects any tracked or candidate
      # file over 20 MB.
      - id: size-check
        name: size check
        language: system
        entry: bash size-check.sh
        pass_filenames: false
        always_run: true

  # The whole-tree prose gates run before pushing, using the CI targets.
  - repo: local
    hooks:
      - id: spelling-and-prose
        name: cspell and vale
        language: system
        entry: bazelisk test //:cspell_test //:vale_test
        stages: [pre-push]
        always_run: true
        pass_filenames: false
