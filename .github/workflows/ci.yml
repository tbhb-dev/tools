---
# Main quality gate. Bazel pins the tools and owns the gates: the hermetic
# checks are cached `bazel test` targets, so `bazel test //...` runs them
# all, and the few that need the network, Git history or the GitHub API run
# as their own steps after it. A final `conclusion` job gives branch
# protection one stable required check.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A lockfile only binds a version it has already seen: moving a pin in
# mise.toml while leaving mise.lock alone would make mise fetch the new
# version and rewrite the lockfile in place. MISE_LOCKED makes that a hard
# failure instead.
env:
  MISE_LOCKED: "1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Bazel 9.x only, the version .bazelversion pins. This repository is
  # public, and tbhb-dev's private runner groups don't take public
  # repositories, so every job runs on GitHub's hosted ubuntu-26.04 runners.
  # The package is pure Python, so one Linux job covers it. The checks that need the network or GitHub's API
  # run in the repo job.
  bazel:
    name: bazel
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    # The push to main run writes the shared action cache with the main
    # token, a secret of the main-only `cache` environment that no pull
    # request can read. Pull requests use the org's PR token, which writes
    # only their own namespace. This job stays in this file because a job in
    # a reusable workflow doesn't get its environment's secrets.
    environment: ${{ github.event_name == 'push' && 'cache' || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # Hardens the runner (Linux), sets up Bazel and its caches, builds
      # complexipy's source wheel on Linux arm64, and fetches the targets
      # with retries. The push to main run skips the disk cache: Bazel
      # uploads only the results it runs, never a disk cache hit, so that
      # run runs every action and fills the remote cache.
      - name: Set up Bazel for CI
        uses: tbhb-dev/rules/.github/actions/setup-bazel-ci@90c4054c67304574d83c82e0b7a4763ceaa85748  # main
        with:
          disk-cache: ${{ github.event_name == 'push' && 'false' || format('{0}-ubuntu-26.04', github.workflow) }}
          cache-save: ${{ github.event_name != 'pull_request' }}

      # The bazel-r2-cache remote cache, through its shared action. A fork's
      # pull request gets no secrets and builds without the cache.
      - name: Use the remote cache
        uses: tbhb-dev/bazel-r2-cache/.github/actions/remote-cache@ced4cd189a557a2b622a7f0906c55a761a037ba2  # main
        with:
          token: ${{ github.event_name == 'push' && secrets.BAZEL_CACHE_TOKEN || secrets.BAZEL_CACHE_PR_TOKEN }}
          pull-request: ${{ github.event.pull_request.number }}

      # //... covers the @tbhb_rules lint, format, shell and docs tests over
      # the whole tree, the buildifier_test, and the preset.update_test that
      # fails when preset.bazelrc is stale.
      - name: Test
        run: bazelisk test --config=ci //...

      # A failed run's test logs, so a failure that does not recur can still
      # be read.
      - name: Keep the test logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: testlogs
          path: |
            .bazel-testlogs/**/test.log
            .bazel-testlogs/**/test.xml
          if-no-files-found: ignore
          include-hidden-files: true

  # The repository-level checks, beside the bazel job so they don't wait
  # behind the tests. runs-on names the same hosted runner as the other
  # jobs.
  repo:
    name: repo
    permissions:
      contents: read
    uses: tbhb-dev/rules/.github/workflows/repo-checks.yml@90c4054c67304574d83c82e0b7a4763ceaa85748  # main
    with:
      runs-on: ubuntu-26.04
      timeout-minutes: 10
      pip-audit-target: //:pip_audit
      module-dirs: .

  # One stable required check for branch protection. `if: always()` runs it
  # even when a needed job failed; the shared action passes only when every
  # needed job's result is exactly "success".
  conclusion:
    name: conclusion
    if: always()
    needs: [bazel, repo]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Fail if any needed job did not succeed
        uses: tbhb-dev/rules/.github/actions/ci-conclusion@90c4054c67304574d83c82e0b7a4763ceaa85748  # main
        with:
          needs: ${{ toJSON(needs) }}

  # The release build, only for a push to main whose `conclusion` passed. It
  # writes the merge sha into the wheel as `tbhbdev/_build.py`, which
  # `tbhbdev --version` reads first, then installs the wheel in a fresh
  # environment and checks the stamp and the alpha commands before anything
  # is published. It holds no write access.
  wheel:
    name: wheel
    if: github.event_name == 'push'
    needs: [conclusion]
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      # uv 0.13.8's Linux x86-64 archive and its sha256, from mise.lock; move
      # them together with the uv pin in mise.toml.
      UV_URL: https://github.com/astral-sh/uv/releases/download/0.13.8/uv-x86_64-unknown-linux-gnu.tar.gz
      UV_SHA256: 5acfd9177cfecf0bf87578f059728215ccc884388988f55f7a65041b57387d91
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        run: |
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/uv.tar.gz" "$UV_URL"
          echo "$UV_SHA256  $RUNNER_TEMP/uv.tar.gz" | sha256sum --check --strict
          mkdir "$RUNNER_TEMP/uv"
          tar --extract --gzip --strip-components=1 --directory "$RUNNER_TEMP/uv" --file "$RUNNER_TEMP/uv.tar.gz"
          echo "$RUNNER_TEMP/uv" >>"$GITHUB_PATH"  # zizmor: ignore[github-env]

      - name: Build the stamped wheel
        env:
          SHA: ${{ github.sha }}
        run: |
          printf '"""Written by the release build."""\n\nCOMMIT = "%s"\n' "$SHA" >src/tbhbdev/_build.py
          uv build --wheel --out-dir dist
          (cd dist && sha256sum tbhbdev-0-py3-none-any.whl >tbhbdev-0-py3-none-any.whl.sha256)

      - name: Smoke-test the built wheel
        env:
          SHA: ${{ github.sha }}
        run: |
          uv venv --python 3.15 "$RUNNER_TEMP/smoke"
          uv pip install --python "$RUNNER_TEMP/smoke/bin/python" dist/tbhbdev-0-py3-none-any.whl
          version=$("$RUNNER_TEMP/smoke/bin/tbhbdev" --version)
          [ "$version" = "tbhbdev 0 ($SHA)" ]
          "$RUNNER_TEMP/smoke/bin/tbhbdev" alpha --help >/dev/null

      - name: Keep the wheel
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: wheel
          path: dist/
          if-no-files-found: error

  # The only job with write access: one GitHub release per merge, tagged
  # `sha-<12 hex>` and marked latest, with the wheel and its sha256 sidecar.
  release:
    name: release
    needs: [wheel]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write  # Create the release and attach the files.
    steps:
      - name: Download the wheel
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: wheel
          path: dist

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          tag="sha-${SHA:0:12}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release $tag exists"
            exit 0
          fi
          gh release create "$tag" dist/* --target "$SHA" --latest \
            --title "$tag" --notes "Merge of $SHA on main."
