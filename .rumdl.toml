[global]
disable = [
  "MD013",  # Line length — we don't hardwrap markdown.
]
respect_gitignore = true
exclude = [
  ".git",
  ".vale",
  "tmp",
]

[MD003]
style = "atx"

[MD004]
style = "dash"

[MD025]
front_matter_title = ""

[MD048]
style = "backtick"

# OKF index files require `* [Title](link) - description` entries, so the
# star marker is part of the format there, not a style choice.
[per-file-ignores]
"**/index.md" = ["MD004"]
# GitHub pastes the template into the pull request body, which starts with
# the comment telling the author how to fill it, not a heading.
".github/PULL_REQUEST_TEMPLATE.md" = ["MD041"]
