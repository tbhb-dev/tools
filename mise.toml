#:schema https://mise.jdx.dev/schema/mise.json
# Tool bootstrap. Bazel pins and runs every gate (`bazelisk test //...`,
# which the pre-commit hooks run); mise provides bazelisk, uv and the tools
# the hooks outside Bazel call.

[settings]
lockfile = true
# uv owns the Python interpreters. Without this, mise reads .python-version
# too and installs its own python, which uv then finds on PATH.
idiomatic_version_file_enable_tools = []

[env]
# uv provisions the interpreter .python-version names rather than settling
# for a system build, which would differ by machine.
UV_PYTHON_PREFERENCE = "only-managed"
# The Bazel-pinned tools (`bazelisk run //:bazel_env` builds the shims).
_.path = [".bazel_env/bin"]

[tools]
# bazelisk runs the Bazel gates, and prek and uv run the commit hooks. The
# hooks' lint tools come from Bazel's pins in .bazel_env/bin.
bazelisk = "1.30.0"
uv = "0.13.6"
prek = "0.5.9"

# Interim until the real PR tooling lands; see `tbhbdev alpha pr --help`.
# Usage: mise run pr -- check | create [--dry-run] | edit --pr N
[tasks.pr]
description = "Check a PR draft and open or update the PR from it (interim)"
run = "uv run tbhbdev alpha pr"

# Interim until the real PR tooling lands; see `tbhbdev alpha merge --help`.
# Usage: mise run merge -- PR [--dry-run].
[tasks.merge]
description = "Squash-merge an approved PR with a plain-text commit message (interim)"
run = "uv run tbhbdev alpha merge"
